name: CMS publish

on:
  push:
    branches:
      - cms-drafts

concurrency:
  group: cms-publish
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cms-drafts
        uses: actions/checkout@v4
        with:
          ref: cms-drafts
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify only CMS content paths changed
        run: |
          set -e
          changed="$(git diff --name-only origin/main...HEAD)"
          if [ -z "$changed" ]; then
            echo "::notice::No changes between cms-drafts and main. Nothing to publish."
            exit 0
          fi
          bad="$(echo "$changed" | grep -vE '^(src/content/|src/assets/events/|public/images/)' || true)"
          if [ -n "$bad" ]; then
            echo "::error::cms-drafts must only contain CMS content changes. Blocked paths:"
            echo "$bad" | sed 's/^/  /'
            exit 1
          fi
          echo "Changed paths (all within allowed content paths):"
          echo "$changed" | sed 's/^/  /'

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CMS_APP_ID }}
          private-key: ${{ secrets.CMS_APP_PRIVATE_KEY }}
          owner: azumag
          repositories: bluemoon

      - name: Merge cms-drafts into main
        env:
          CMS_MERGE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          if [ -z "$CMS_MERGE_TOKEN" ]; then
            echo "::error::GitHub App token could not be created. Check CMS_APP_ID / CMS_APP_PRIVATE_KEY secrets."
            exit 1
          fi
          # actions/checkout sets http.https://github.com/.extraheader with the GITHUB_TOKEN,
          # which overrides credentials in the remote URL. Unset it so the push uses the app token.
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${CMS_MERGE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -b main origin/main
          if git merge --no-edit origin/cms-drafts; then
            git push origin main
            echo "::notice::cms-drafts has been merged into main. The main branch workflow will deploy to production."
            # Sync main back to cms-drafts so the CMS branch stays up to date with code changes
            # and the workflow file (which is read from the pushed branch for push events).
            if git merge-base --is-ancestor origin/cms-drafts main; then
              git push origin main:refs/heads/cms-drafts
              echo "::notice::cms-drafts has been synced to main."
            else
              echo "::warning::cms-drafts is behind main but cannot be fast-forwarded. Sync manually."
            fi
          else
            echo "::error::Merge conflict between cms-drafts and main. Resolve manually (e.g. merge main into cms-drafts)."
            exit 1
          fi
