name: PR build check & preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cms-token-smoke:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Create CMS GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.0.0
        with:
          app-id: ${{ secrets.CMS_APP_ID }}
          private-key: ${{ secrets.CMS_APP_PRIVATE_KEY }}
          owner: azumag
          repositories: bluemoon

      - name: Verify token was created
        env:
          CMS_MERGE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: test -n "$CMS_MERGE_TOKEN"

  build-and-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Deploy preview Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.119.0'
          command: deploy --name bluemoon-pr-${{ github.event.pull_request.number }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
          WORKER_NAME: bluemoon-pr-${{ github.event.pull_request.number }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            if (!url) {
              core.setFailed('Wrangler did not return a workers.dev deployment URL');
              return;
            }

            const marker = '<!-- pr-preview-comment -->';
            const body = [
              marker,
              `🔍 Cloudflare Workers preview: ${url}`,
              `Worker: ${process.env.WORKER_NAME}`,
              '',
              '(このコメントは新しいpushのたびに更新されます)',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Delete preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_NAME: bluemoon-pr-${{ github.event.pull_request.number }}
        run: |
          account_id="$(sed -nE 's/^account_id[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' wrangler.toml | sed -n '1p')"
          if [[ -z "$account_id" ]]; then
            echo 'account_id is missing from wrangler.toml' >&2
            exit 1
          fi

          response_file="$RUNNER_TEMP/cloudflare-delete-response.json"
          http_status="$(curl --silent --show-error --retry 3 --retry-all-errors \
            --request DELETE \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${account_id}/workers/scripts/${WORKER_NAME}?force=true")"

          case "$http_status" in
            200|204)
              echo "Deleted ${WORKER_NAME}"
              ;;
            404)
              echo "${WORKER_NAME} was already absent"
              ;;
            *)
              echo "Cloudflare delete failed with HTTP ${http_status}" >&2
              cat "$response_file" >&2
              exit 1
              ;;
          esac
