name: main branch workflow
on:
  push:
    branches:
      - main

jobs:
  cloudflare-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      # CMS(Sveltia CMS)はcms-draftsブランチを読み書きするため、
      # mainへのコード・コンテンツ変更をcms-draftsへ同期する
      # (同期pushでcms-publish.ymlが発火するが、差分なしのため何も公開されない)
      - name: Sync main to cms-drafts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin cms-drafts
          if git merge-base --is-ancestor origin/cms-drafts main; then
            git push origin main:refs/heads/cms-drafts
            echo "::notice::cms-drafts synced to main"
          else
            echo "::warning::cms-drafts is behind main but cannot be fast-forwarded. Sync manually."
          fi

  deploy-cms-auth:
    runs-on: ubuntu-latest
    needs: cloudflare-deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # サイト配備と同じNode・lockfile固定のWranglerを使う
      # (setup-nodeなしではrunner既定のNodeになり、wrangler-actionが
      #  lockfile外のWranglerを追加インストールしていた)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Sveltia CMS Auth Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config workers/sveltia-cms-auth/wrangler.toml
