name: main branch workflow
on:
  push:
    branches:
      - main

jobs:
  cloudflare-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.119.0'
          command: deploy

  deploy-cms-auth:
    runs-on: ubuntu-latest
    needs: cloudflare-deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Sveltia CMS Auth Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.119.0'
          workingDirectory: workers/sveltia-cms-auth
          command: deploy
